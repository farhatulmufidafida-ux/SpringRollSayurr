<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VEGROLL – Crispy Vegetable Spring Roll</title>

<!-- Google Fonts: Poppins -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />

<style>
  /* Reset & base */
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin:0; font-family: 'Poppins', sans-serif; background: #fffef9; color: #2c3e25; line-height: 1.5;
  }
  img {
    max-width: 100%; display: block;
  }
  a {
    color: inherit; text-decoration: none;
  }
  button {
    cursor: pointer;
    font-family: inherit;
  }
  h1, h2, h3, h4, h5 {
    margin: 0 0 0.5em 0;
    font-weight: 600;
    color: #2c3e25;
  }
  p {
    margin: 0 0 1em 0;
    font-weight: 300;
  }
  /* Scroll smooth */
  html {
    scroll-behavior: smooth;
  }

  /* Colors */
  :root {
    --sage-green: #9caf88;
    --dark-green: #3a5a40;
    --cream-white: #fffef9;
    --gold-orange: #f8a556;
    --shadow-light: rgba(58, 90, 64, 0.15);
  }

  /* Container */
  .container {
    max-width: 1200px;
    margin: auto;
    padding: 0 1.25rem;
  }

  /* Navbar */
  header {
    position: sticky;
    top: 0;
    background: var(--cream-white);
    box-shadow: 0 2px 4px var(--shadow-light);
    z-index: 1000;
  }
  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 64px;
  }
  .logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--dark-green);
    letter-spacing: 3px;
    user-select: none;
  }
  .logo span {
    color: var(--gold-orange);
    font-weight: 800;
  }
  .nav-links {
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }
  .nav-links a {
    font-weight: 500;
    font-size: 0.95rem;
    padding: 0.3rem 0.5rem;
    transition: color 0.3s ease;
  }
  .nav-links a:hover,
  .nav-links a:focus {
    color: var(--gold-orange);
  }
  .btn-primary {
    background-color: var(--gold-orange);
    color: white;
    padding: 0.5rem 1.2rem;
    border-radius: 24px;
    border: none;
    font-weight: 600;
    box-shadow: 0 3px 8px rgb(248 165 86 / 0.6);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }
  .btn-primary:hover,
  .btn-primary:focus {
    background-color: #d7792d;
    box-shadow: 0 5px 12px rgb(215 121 45 / 0.8);
  }
  /* Cart Icon */
  .cart-btn {
    position: relative;
    background: none;
    border: none;
    font-size: 1.3rem;
    color: var(--dark-green);
    margin-left: 1rem;
  }
  .cart-indicator {
    position: absolute;
    top: -6px;
    right: -6px;
    background: var(--gold-orange);
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    text-align: center;
    line-height: 18px;
    user-select: none;
  }

  /* Responsive Navbar for mobile */
  .nav-toggle {
    display: none;
    background: none;
    border: none;
    font-size: 1.6rem;
    color: var(--dark-green);
  }
  @media (max-width: 768px) {
    .nav-links {
      position: fixed;
      top: 64px;
      right: 0;
      height: calc(100vh - 64px);
      width: 220px;
      background: var(--cream-white);
      flex-direction: column;
      padding: 2rem 1rem;
      gap: 1.5rem;
      box-shadow: -2px 0 8px var(--shadow-light);
      transform: translateX(100%);
      transition: transform 0.3s ease;
      z-index: 1001;
    }
    .nav-links.active {
      transform: translateX(0);
    }
    .nav-toggle {
      display: block;
    }
  }

  /* Hero Section */
  #hero {
    padding: 3rem 0 4rem 0;
    background: linear-gradient(135deg, var(--sage-green) 10%, var(--dark-green) 90%);
    color: #fffef9;
    position: relative;
    overflow: hidden;
  }
  #hero .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    flex-wrap: wrap;
  }
  #hero-text {
    flex: 1 1 380px;
    max-width: 520px;
  }
  #hero-text h1 {
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 0.6em;
    text-shadow: 1px 1px 8px rgba(0,0,0,0.2);
  }
  #hero-text p {
    font-weight: 400;
    font-size: 1.1rem;
    margin-bottom: 1.5em;
    text-shadow: 1px 1px 5px rgba(0,0,0,0.15);
  }
  .btn-hero {
    margin-right: 1rem;
    padding: 0.65rem 1.6rem;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    color: var(--dark-green);
    background: var(--cream-white);
    box-shadow: 0 3px 10px rgba(255 255 255 / 0.9);
    transition: background-color 0.25s ease;
  }
  .btn-hero:hover,
  .btn-hero:focus {
    background: #e8e3d4;
  }

  #hero-image-container {
    flex: 1 1 380px;
    max-width: 450px;
    position: relative;
  }
  #hero-image-container img {
    border-radius: 20px;
    box-shadow: 0 10px 18px rgba(0,0,0,0.2);
    transform-style: preserve-3d;
    transition: transform 0.3s ease;
  }
  #hero-image-container img:hover {
    transform: translateY(-10px) rotate(-3deg);
  }

  /* Decorative elements */
  .badge-fresh {
    position: absolute;
    top: 16px;
    left: 16px;
    background: var(--gold-orange);
    color: var(--dark-green);
    font-weight: 700;
    font-size: 0.75rem;
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    user-select: none;
    box-shadow: 0 2px 8px var(--shadow-light);
  }
  .decorative-vege {
    position: absolute;
    width: 80px;
    opacity: 0.15;
    pointer-events: none;
    user-select: none;
  }
  .decorative-vege-1 {
    top: 20px; right: 10%;
    transform: rotate(20deg);
  }
  .decorative-vege-2 {
    bottom: 10px; left: 2%;
    transform: rotate(-15deg);
  }

  /* Section titles */
  section h2.section-title {
    font-size: 2rem;
    text-align: center;
    margin: 2.5rem 0 2rem 0;
    color: var(--dark-green);
  }

  /* Keunggulan Produk */
  #advantages {
    padding: 3rem 0 3rem 0;
    background: var(--cream-white);
  }
  .advantages-list {
    max-width: 900px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 2rem;
  }
  .advantage-item {
    background: #f9faf6;
    border-radius: 15px;
    padding: 1.6rem;
    text-align: center;
    box-shadow: 0 2px 7px var(--shadow-light);
    transition: transform 0.3s ease;
  }
  .advantage-item:hover,
  .advantage-item:focus-within {
    transform: translateY(-5px);
  }
  .adv-icon {
    font-size: 2.8rem;
    color: var(--gold-orange);
    margin-bottom: 0.8rem;
  }
  .adv-text {
    font-weight: 500;
    color: var(--dark-green);
  }

  /* Menu Produk */
  #menu {
    padding: 3rem 0 3rem 0;
    background: #f4f7f0;
  }
  .product-list {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 2rem;
  }
  .product-card {
    background: white;
    border-radius: 20px;
    padding: 1rem;
    box-shadow: 0 4px 12px var(--shadow-light);
    display: flex;
    flex-direction: column;
    transition: box-shadow 0.35s ease;
    position: relative;
  }
  .product-card:hover,
  .product-card:focus-within {
    box-shadow: 0 8px 24px rgba(58, 90, 64, 0.3);
  }
  .product-img {
    border-radius: 16px;
    overflow: hidden;
    height: 180px;
  }
  .product-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .product-card:hover .product-img img,
  .product-card:focus-within .product-img img {
    transform: scale(1.06);
  }
  .product-info {
    flex-grow: 1;
    padding: 1rem 0 0.5rem 0;
  }
  .product-name {
    font-weight: 600;
    font-size: 1.15rem;
    margin-bottom: 0.4rem;
    color: var(--dark-green);
  }
  .product-desc {
    font-weight: 300;
    font-size: 0.95rem;
    color: #556f4a;
  }
  .product-price {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--gold-orange);
    margin-top: 0.8rem;
  }
  .badge-popular {
    position: absolute;
    top: 14px;
    left: 14px;
    background-color: var(--gold-orange);
    color: var(--dark-green);
    font-weight: 700;
    font-size: 0.75rem;
    padding: 0.3rem 0.8rem;
    border-radius: 12px;
    box-shadow: 0 2px 6px var(--shadow-light);
    user-select: none;
  }
  .btn-add-cart {
    margin-top: auto;
    background: var(--sage-green);
    border: none;
    color: white;
    padding: 0.55rem;
    font-weight: 600;
    border-radius: 30px;
    box-shadow: 0 3px 8px rgb(156 175 136 / 0.7);
    transition: background-color 0.3s ease;
  }
  .btn-add-cart:hover,
  .btn-add-cart:focus {
    background: var(--dark-green);
    box-shadow: 0 5px 14px rgb(58 90 64 / 0.9);
  }

  /* Promo Spesial */
  #promo {
    background: var(--gold-orange);
    padding: 2.8rem 1.25rem;
    text-align: center;
    color: var(--dark-green);
    font-weight: 600;
    border-radius: 16px;
    box-shadow: 0 6px 18px rgba(248,165,86,0.5);
    max-width: 900px;
    margin: 2rem auto 3rem auto;
    user-select: none;
  }
  #promo h3 {
    font-size: 1.8rem;
    margin-bottom: 0.5em;
  }
